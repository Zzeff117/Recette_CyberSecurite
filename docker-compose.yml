services:
  web:
    build: .
    container_name: cybersec-web
    ports:
      - "8085:80"
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: cybersec-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cybersec-phpmyadmin
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    name: cybersec_network